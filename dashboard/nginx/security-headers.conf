# Included in EVERY location: nginx's add_header in a location block replaces (doesn't
# extend) headers set at server level, so they're repeated here once and included.
#
# CSP: scripts only from this origin (Vite emits no inline scripts), API calls only to this
# origin, never framed. style-src needs 'unsafe-inline' because Radix UI's scroll lock
# injects a <style> element at runtime; inline *styles* can't run code (docs/design.md D5.6).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
