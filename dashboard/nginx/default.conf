# Static dashboard. /api and /mcp never reach this server: the Ingress routes them to the
# gateway. Unknown paths fall back to index.html (client-side routing).
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Kubelet probes only (the Ingress sends /healthz to the gateway).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html and SPA routes: always revalidate so a new deploy is picked up.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
