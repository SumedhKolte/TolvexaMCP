{{- $ctx := dict "root" . "component" "wordpress" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store
  labels:
    {{- include "store.labels" $ctx | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.wordpress.php.uploadMaxSize | lower | quote }}
    {{- if and .Values.global.tls.enabled .Values.global.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.global.tls.clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  {{- if .Values.global.tls.enabled }}
  tls:
    - hosts: [{{ .Values.global.storeHost | quote }}]
      secretName: store-tls
  {{- end }}
  rules:
    - host: {{ .Values.global.storeHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  name: http
