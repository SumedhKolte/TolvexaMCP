{{- $ctx := dict "root" . "component" "wordpress" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-content
  labels:
    {{- include "store.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- include "store.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.wordpress.persistence.size }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-php
  labels:
    {{- include "store.labels" $ctx | nindent 4 }}
data:
  zz-store.ini: |
    memory_limit = {{ .Values.wordpress.php.memoryLimit }}
    upload_max_filesize = {{ .Values.wordpress.php.uploadMaxSize }}
    post_max_size = {{ .Values.wordpress.php.uploadMaxSize }}
    expose_php = Off
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    {{- include "store.labels" $ctx | nindent 4 }}
spec:
  # Exactly one replica: wp-content is a ReadWriteOnce volume. Scaling WordPress
  # horizontally needs RWX storage or object storage for uploads (docs/design.md).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "store.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store.labels" $ctx | nindent 8 }}
      annotations:
        checksum/php-ini: {{ .Values.wordpress.php | toJson | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "store.podSecurityContext" (dict "uid" 33) | nindent 8 }}
        # Lets Apache (uid 33, no capabilities) bind port 80. A namespaced "safe" sysctl,
        # allowed by Pod Security "restricted"; avoids running as root or NET_BIND_SERVICE.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      {{- if not .Values.global.tls.enabled }}
      # WP-Cron and WooCommerce's Action Scheduler call the site's own URL. Point that
      # hostname at the pod itself so loopback requests never leave the pod.
      hostAliases:
        - ip: 127.0.0.1
          hostnames: [{{ .Values.global.storeHost | quote }}]
      {{- end }}
      initContainers:
        # Pre-populates /var/www/html so the image entrypoint finds index.php and skips
        # its own copy (which fails as non-root; see the helper for details).
        {{- include "store.copyCoreInitContainer" (dict "root" . "seedContent" true "resources" .Values.wordpress.resources) | nindent 8 }}
      containers:
        - name: wordpress
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            {{- include "store.wordpressEnv" . | nindent 12 }}
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                {{- include "store.wpConfigExtra" (dict "root" . "webPod" true) | nindent 16 }}
          # Readiness exercises PHP and the database (per spec: /wp-login.php). Liveness
          # only checks that Apache accepts connections, so a database outage makes the pod
          # NotReady instead of putting WordPress into a restart loop.
          readinessProbe:
            httpGet: { path: /wp-login.php, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          securityContext:
            {{- include "store.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # Core files are copied from the image into an emptyDir on every start (by the
            # copy-core init container); only wp-content is persistent.
            - { name: html, mountPath: /var/www/html }
            - { name: content, mountPath: /var/www/html/wp-content }
            - { name: php-ini, mountPath: /usr/local/etc/php/conf.d/zz-store.ini, subPath: zz-store.ini, readOnly: true }
            - { name: apache-run, mountPath: /var/run/apache2 }
            - { name: apache-lock, mountPath: /var/lock/apache2 }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: html
          emptyDir: {}
        - name: content
          persistentVolumeClaim:
            claimName: wordpress-content
        - name: php-ini
          configMap:
            name: wordpress-php
        - name: apache-run
          emptyDir: {}
        - name: apache-lock
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels:
    {{- include "store.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "store.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
