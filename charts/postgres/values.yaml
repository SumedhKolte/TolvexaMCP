global:
  storageClass: ""

image:
  repository: postgres
  tag: "16.15-bookworm"
  pullPolicy: IfNotPresent
# Database and role the gateway uses. The password comes from the Secret below; the
# gateway's DATABASE_URL (in gateway-secrets) is derived from the same value by
# scripts/create-secrets.sh.
database: gateway
user: gateway
secretName: postgres-secrets
persistence:
  size: 2Gi
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }
