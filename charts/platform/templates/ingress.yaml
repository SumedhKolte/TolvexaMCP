{{- /*
One host for dashboard and gateway, so the session cookie is first-party and the browser
needs no CORS. /metrics is deliberately NOT routed (cluster-internal only).
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub
  labels:
    app.kubernetes.io/part-of: team-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Tool calls and (Phase 6) chat streams can take a while; SSE must not be buffered.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    {{- if and .Values.global.tls.enabled .Values.global.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.global.tls.clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  {{- if .Values.global.tls.enabled }}
  tls:
    - hosts: [{{ .Values.global.hubHost | quote }}]
      secretName: hub-tls
  {{- end }}
  rules:
    - host: {{ .Values.global.hubHost | quote }}
      http:
        paths:
          {{- range $p := list "/api" "/mcp" }}
          - path: {{ $p }}
            pathType: Prefix
            backend:
              service: { name: gateway, port: { name: http } }
          {{- end }}
          - path: /healthz
            pathType: Exact
            backend:
              service: { name: gateway, port: { name: http } }
          {{- if .Values.dashboard.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: dashboard, port: { name: http } }
          {{- end }}
