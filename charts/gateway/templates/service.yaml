apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- if .Values.metricsAnnotations }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.metricsPort | quote }}
    prometheus.io/path: /metrics
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
    # Scraped in-cluster only; a ServiceMonitor can select this Service by its labels
    # and use `port: metrics`.
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
