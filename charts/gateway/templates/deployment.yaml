apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
      {{- if or .Values.imageId .Values.metricsAnnotations }}
      annotations:
        {{- with .Values.imageId }}
        team-mcp/image-id: {{ . | quote }}
        {{- end }}
        {{- if .Values.metricsAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metricsPort | quote }}
        prometheus.io/path: /metrics
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.image.pullSecrets }}
      # Private registry: pull with these Secrets (created by create-secrets.sh from .env).
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Lets in-flight requests (and the graceful shutdown in index.ts) finish on rollout.
      terminationGracePeriodSeconds: 20
      containers:
        - name: gateway
          image: {{ include "gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          env:
            - { name: PORT, value: {{ .Values.port | quote }} }
            - { name: METRICS_PORT, value: {{ .Values.metricsPort | quote }} }
            - { name: LOG_LEVEL, value: {{ .Values.config.logLevel | quote }} }
            - { name: WOO_MCP_URL, value: {{ .Values.config.wooMcpUrl | quote }} }
            # Secure cookies whenever the site is served over TLS.
            - { name: COOKIE_SECURE, value: {{ .Values.global.tls.enabled | quote }} }
            - { name: PUBLIC_BASE_URL, value: "{{ ternary "https" "http" .Values.global.tls.enabled }}://{{ .Values.global.hubHost }}" }
            - { name: TRUST_PROXY_HOPS, value: {{ .Values.config.trustProxyHops | quote }} }
            - { name: HEALTH_INTERVAL_MS, value: {{ .Values.config.healthIntervalMs | quote }} }
            - { name: DEFAULT_TOOL_TIMEOUT_MS, value: {{ .Values.config.defaultToolTimeoutMs | quote }} }
            - { name: DEFAULT_MEMBER_TOOL_ACCESS, value: {{ .Values.config.defaultMemberToolAccess | quote }} }
            - { name: UPSTREAM_HOST_ALLOWLIST, value: {{ .Values.config.upstreamHostAllowlist | quote }} }
            - { name: ALLOW_PUBLIC_UPSTREAMS, value: {{ .Values.config.allowPublicUpstreams | quote }} }
            - { name: LLM_BASE_URL, value: {{ .Values.config.llmBaseUrl | quote }} }
            - { name: LLM_MODEL, value: {{ .Values.config.llmModel | quote }} }
            - { name: LLM_TIMEOUT_MS, value: {{ .Values.config.llmTimeoutMs | quote }} }
            - { name: LLM_REASONING_EFFORT, value: {{ .Values.config.llmReasoningEffort | quote }} }
            - { name: CHAT_MAX_ITERATIONS, value: {{ .Values.config.chatMaxIterations | quote }} }
            - { name: CHAT_PII_MASKING, value: {{ .Values.config.chatPiiMasking | quote }} }
            {{- with .Values.global.stores }}
            {{- if .enabled }}
            # Multi-store (bonus): the provisioner service; PROVISIONER_TOKEN is in the Secret.
            - { name: PROVISIONER_URL, value: "http://provisioner.{{ .provisionerNamespace | default "provisioner" }}.svc.cluster.local:8080" }
            - { name: STORE_HOST_SUFFIX, value: {{ .hostSuffix | quote }} }
            - { name: MAX_STORES_PER_USER, value: {{ .maxPerUser | quote }} }
            - { name: MAX_STORES_TOTAL, value: {{ .maxTotal | quote }} }
            - { name: STORE_PROVISION_TIMEOUT_MS, value: {{ mul .provisionTimeoutMinutes 60000 | quote }} }
            - { name: STORE_RESYNC_INTERVAL_MS, value: {{ mul (.resyncMinutes | default 10) 60000 | quote }} }
            {{- end }}
            {{- end }}
          # Keep serving for a few seconds after termination starts, until the Ingress and
          # Service have stopped routing here; only then does SIGTERM start the graceful
          # exit. Without it, a rolling update drops the odd in-flight request (Phase 8).
          lifecycle:
            preStop:
              exec:
                command: [sleep, "{{ .Values.preStopSleepSeconds }}"]
          # Liveness: process only (no dependencies). Readiness: Postgres reachable.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
